<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAVANDUS S.R.L. - Acceso al Sistema</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        body { background: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #fff; width: 100%; max-width: 440px; padding: 35px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,.4); }
        .login-card .brand { margin-bottom: 25px; }
        .login-card p.sub { font-size: 10px; color: #64748b; text-transform: uppercase; }
        .form-group { margin-bottom: 18px; }
        .btn-submit { width: 100%; padding: 11px; font-size: 14px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .demo-info { margin-top: 25px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 12px; line-height: 1.6; }
        code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">
        <img src="logo.png" alt="Logo LAVANDUS" class="brand-logo" onerror="this.style.display='none'">
        <div><h2>LAVANDUS S.R.L.</h2><p class="sub">Lavandería & Logística Industrial</p></div>
    </div>

    <div id="alertError" class="alert-error"></div>

    <form onsubmit="iniciarSesion(event)" novalidate>
        <div class="form-group">
            <label for="usuario">Correo Electrónico:</label>
            <input type="email" id="usuario" placeholder="ejemplo@lavandus.com" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit">Ingresar al Sistema</button>
    </form>

    <div class="demo-info">
        <strong>Credenciales de prueba (solo demo)</strong><br>
        Cliente: <code>cliente@lavandus.com</code> / <code>Cliente2026!</code><br>
        Operaciones: <code>admin@lavandus.com</code> / <code>Lavandus2026!</code><br>
        Encargado: <code>encargado@lavandus.com</code> / <code>Planta2026!</code>
    </div>
</div>

<script src="funciones.js"></script>
<script>
    if (usuarioActual()) location.href = 'solicitud.html';

    function iniciarSesion(e) {
        e.preventDefault();
        const email = document.getElementById('usuario').value.trim().toLowerCase();
        const pass = document.getElementById('password').value;

        const errores = [];
        if (!email) errores.push('Ingresá el correo electrónico.');
        else if (!emailValido(email)) errores.push('El correo electrónico no tiene un formato válido.');
        if (!pass) errores.push('Ingresá la contraseña.');
        if (!mostrarErrores('alertError', errores)) return;

        const persona = getPersonas().find(p => p.email === email);
        if (!persona || persona.pass !== pass) {
            mostrarErrores('alertError', ['Usuario o contraseña incorrectos.']);
            return;
        }
        sessionStorage.setItem(K_SESION, JSON.stringify({ email: persona.email }));
        location.href = 'solicitud.html';
    }
</script>
</body>
</html>
